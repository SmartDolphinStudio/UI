name: Audit CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --global npm@11.19.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.5'
          cache: false
      - run: |
          for app in auth-login captcha-check effort-slider chart-kit; do
            (cd "$app" && npm ci --ignore-scripts && npm run build && npm audit --audit-level=low)
          done
      - run: cd captcha-check/backend && go test -race ./... && go vet ./...
      - run: cd chart-kit && node scripts/generate-manifest.mjs && git diff --exit-code src/data/diagrams.json
      - run: node scripts/check-assets.mjs
        env:
          ASSET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

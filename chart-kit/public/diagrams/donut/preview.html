<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f5f5f5;
        width: 1440px;
        height: 808px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      svg {
        display: block;
        width: 1280px;
        height: 640px;
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1000 500" role="img" aria-labelledby="donut-title donut-desc">
      <title id="donut-title">Where traffic comes from · channel mix</title>
      <desc id="donut-desc">
        Donut chart of monthly sessions by acquisition channel: organic search 38 percent, paid ads 24,
        social 18, referral 12, email 8, with organic search as the leading channel.
      </desc>
      <defs>
        <pattern id="donut-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)" />
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5" />
      <rect width="100%" height="100%" fill="url(#donut-dots)" opacity="0.55" />

      <text
        x="40"
        y="42"
        fill="#4f5d75"
        font-size="8"
        font-family="'Geist Mono', monospace"
        letter-spacing="0.18em"
      >
        DONUT · COMPOSITION
      </text>
      <text
        x="40"
        y="74"
        fill="#2d3142"
        font-size="27"
        font-style="italic"
        font-family="'Instrument Serif', serif"
      >
        Where traffic comes from
      </text>
      <text x="40" y="96" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">
        Share of monthly sessions by acquisition channel · sample data, sums to 100%
      </text>

      <g id="slices"></g>

      <text
        id="center-value"
        x="330"
        y="277"
        fill="#eb6c36"
        font-size="40"
        font-style="italic"
        font-family="'Instrument Serif', serif"
        text-anchor="middle"
      ></text>
      <text
        x="330"
        y="301"
        fill="#4f5d75"
        font-size="8"
        font-family="'Geist Mono', monospace"
        letter-spacing="0.14em"
        text-anchor="middle"
      >
        LEADING CHANNEL
      </text>
      <text
        id="center-label"
        x="330"
        y="317"
        fill="#2d3142"
        font-size="10"
        font-weight="600"
        font-family="'Geist', sans-serif"
        text-anchor="middle"
      ></text>

      <g id="legend"></g>

      <line x1="40" y1="462" x2="960" y2="462" stroke="rgba(45,49,66,0.10)" stroke-width="0.8" />
      <text
        x="40"
        y="478"
        fill="#4f5d75"
        font-size="8"
        font-family="'Geist Mono', monospace"
        letter-spacing="0.18em"
      >
        LEGEND
      </text>
      <rect x="40" y="488" width="16" height="10" rx="2" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1" />
      <text x="64" y="497" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">
        Leading channel · focal slice
      </text>
      <rect x="280" y="488" width="16" height="10" rx="2" fill="rgba(79,93,117,0.20)" stroke="#4f5d75" stroke-width="0.8" />
      <text x="304" y="497" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">
        Other channels
      </text>
    </svg>

    <script>
      const SEGMENTS = [
        { label: 'Organic search', value: 38, focal: true },
        { label: 'Paid ads', value: 24 },
        { label: 'Social', value: 18 },
        { label: 'Referral', value: 12 },
        { label: 'Email', value: 8 },
      ]
      const NEUTRAL_FILLS = [
        'rgba(79,93,117,0.30)',
        'rgba(79,93,117,0.20)',
        'rgba(79,93,117,0.26)',
        'rgba(79,93,117,0.14)',
      ]
      const CX = 330,
        CY = 285,
        R_OUTER = 148,
        R_INNER = 92,
        PAD_ANGLE = 1.6

      function polar(cx, cy, r, angleDeg) {
        const a = ((angleDeg - 90) * Math.PI) / 180
        return [cx + r * Math.cos(a), cy + r * Math.sin(a)]
      }
      function donutArc(cx, cy, rOuter, rInner, startAngle, endAngle) {
        const [x1, y1] = polar(cx, cy, rOuter, endAngle)
        const [x2, y2] = polar(cx, cy, rOuter, startAngle)
        const [x3, y3] = polar(cx, cy, rInner, startAngle)
        const [x4, y4] = polar(cx, cy, rInner, endAngle)
        const largeArc = endAngle - startAngle > 180 ? 1 : 0
        return [
          `M ${x1.toFixed(2)} ${y1.toFixed(2)}`,
          `A ${rOuter} ${rOuter} 0 ${largeArc} 0 ${x2.toFixed(2)} ${y2.toFixed(2)}`,
          `L ${x3.toFixed(2)} ${y3.toFixed(2)}`,
          `A ${rInner} ${rInner} 0 ${largeArc} 1 ${x4.toFixed(2)} ${y4.toFixed(2)}`,
          'Z',
        ].join(' ')
      }

      const total = SEGMENTS.reduce((s, x) => s + x.value, 0)
      const slicesGroup = document.getElementById('slices')
      const legendGroup = document.getElementById('legend')
      let cursor = 0
      SEGMENTS.forEach((segment, i) => {
        const sweep = (segment.value / total) * 360
        const startAngle = cursor + PAD_ANGLE / 2
        const endAngle = cursor + sweep - PAD_ANGLE / 2
        cursor += sweep
        const fill = segment.focal
          ? 'rgba(235,108,54,0.12)'
          : NEUTRAL_FILLS[(i - 1 + NEUTRAL_FILLS.length) % NEUTRAL_FILLS.length]
        const stroke = segment.focal ? '#eb6c36' : '#4f5d75'
        const sw = segment.focal ? 1.4 : 0.8

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path')
        path.setAttribute('d', donutArc(CX, CY, R_OUTER, R_INNER, startAngle, endAngle))
        path.setAttribute('fill', fill)
        path.setAttribute('stroke', stroke)
        path.setAttribute('stroke-width', sw)
        slicesGroup.appendChild(path)

        const y = 196 + i * 44
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect')
        rect.setAttribute('x', 610)
        rect.setAttribute('y', y - 11)
        rect.setAttribute('width', 16)
        rect.setAttribute('height', 10)
        rect.setAttribute('rx', 2)
        rect.setAttribute('fill', fill)
        rect.setAttribute('stroke', stroke)
        rect.setAttribute('stroke-width', sw)
        legendGroup.appendChild(rect)

        const name = document.createElementNS('http://www.w3.org/2000/svg', 'text')
        name.setAttribute('x', 636)
        name.setAttribute('y', y - 1)
        name.setAttribute('fill', segment.focal ? '#eb6c36' : '#2d3142')
        name.setAttribute('font-size', 11.5)
        name.setAttribute('font-weight', 600)
        name.setAttribute('font-family', "'Geist', sans-serif")
        name.textContent = segment.label
        legendGroup.appendChild(name)

        const value = document.createElementNS('http://www.w3.org/2000/svg', 'text')
        value.setAttribute('x', 950)
        value.setAttribute('y', y - 1)
        value.setAttribute('fill', segment.focal ? '#eb6c36' : '#4f5d75')
        value.setAttribute('font-size', 11)
        value.setAttribute('font-family', "'Geist Mono', monospace")
        value.setAttribute('text-anchor', 'end')
        if (segment.focal) value.setAttribute('font-weight', 600)
        value.textContent = segment.value + '%'
        legendGroup.appendChild(value)
      })

      const focal = SEGMENTS.find((s) => s.focal)
      document.getElementById('center-value').textContent = focal.value + '%'
      document.getElementById('center-label').textContent = focal.label
    </script>
  </body>
</html>
